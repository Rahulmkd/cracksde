services:
  postgres:
    image: postgres:16-alpine
    container_name: cracksde-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cracksde_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cracksde_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: cracksde-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5001
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/cracksde_db
      BETTER_AUTH_SECRET: production-secret-key-change-in-prod-environment-32chars
      BETTER_AUTH_URL: http://api:5001
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5001:5001"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: cracksde-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5001
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
