name: Crack SDE CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Types & Contracts
        run: npm run build --workspace=@cracksde/shared

      - name: Run Monorepo Typechecks
        run: npm run typecheck

      - name: Generate Prisma Client
        run: npm run db:generate --workspace=@cracksde/api

      - name: Build Backend API
        run: npm run build --workspace=@cracksde/api

      - name: Build Frontend Web App
        run: npm run build --workspace=@cracksde/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
